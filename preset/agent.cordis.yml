# 简报预设（jianbao）—— 由 PTC 派生，只保留写简报需要的工具面。
#
# 关键差异（相对官方 ptc）：
#   1. persona.prefix 载入本目录 prompt.md —— 简报专岗提示词，**不注入 AGENTS.md**
#      （agent-instructions 行被移除，所以 ~/.dsh/AGENTS.md 不会进来）；
#   2. skill-filesystem 只扫本包随带技能目录，不扫用户技能根；
#   3. tool-allow-guard 把工具面收窄到"读/写/编译/搜/图"几类，去掉 mcp/skill/blender/terminal；
#   4. 挂 dsh-jianbao 的 gate 行：只有本预设的会话才允许注册「简报」工作台入口。
#
# 下面 persona.prefix 的占位符由 index.js 在注册前替换成 prompt.md 正文
# （块标量缩进逐行补齐）。注意注释里不能出现那个占位符字面量 ——
# indexOf 会命中第一处，替换就落到注释行上，YAML 直接废掉（已踩过）。

- id: persona
  name: '@deepseek-ai/dsh-persona'
  config:
    prefix: |-
      {{PROMPT}}
    includeRuntimeContext: false

- id: time-context
  name: '@deepseek-ai/dsh-time-context'

# ── shell：写稿要跑 xelatex，两个平台都留 ──────────────────────────
- id: tool-bash
  name: '@deepseek-ai/dsh-tool-bash'
  disabled: !!js process.platform === 'win32'

- id: tool-pwsh
  name: '@deepseek-ai/dsh-tool-pwsh'
  disabled: !!js process.platform !== 'win32'

# ── filesystem ────────────────────────────────────────────────────
- id: tool-fs
  name: '@deepseek-ai/dsh-tool-fs'

- id: tool-fs-search
  name: '@deepseek-ai/dsh-tool-fs-search'
  config:
    sampleOverCapGlobResults: false

# ── PTC 运行时（按可用性条件挂载）────────────────────────────────
#
# **这一行曾经让整份预设 broken，必须保住一个事实：**
# registry 解析预设里的**裸包名**时，用的是它自己所在 Loader 的 base
# （桌面版 = asar 内的 dsh 安装平面），不是 profile 平面。
#   · @deepseek-ai/dsh-tool-executor-ptc 只随桌面版 asar 发行，npm 安装里没有；
#   · @zws/dsh-jianbao（下面简报本体那行）只存在于 profile。
# 两者从「另一个平面」都解析不到，而**任何一行失败都会让整份预设作废**。
#
# 所以包里写的是包名，由 preset/index.js 的 resolveRowNames() 在交给 registry 前
# 把每一行的 name 重新解析成**绝对 file:// URL**；解析不到的整行丢弃（而不是留着炸）。
- id: tool-executor-ptc
  name: '@deepseek-ai/dsh-tool-executor-ptc'

# ── skills：只扫本包随带的技能目录 ────────────────────────────────
#
# 目录用 JS 表达式 + dshHomePath 给：**不能写 import.meta** —— cordis 求值那个标签时用的是
#   new Function('ctx', 'expr', 'with (ctx) { return eval(expr) }')
# 在 new Function 里 import.meta 是**语法错误**（Cannot use 'import.meta' outside a module），
# 抛出的 SyntaxError 会被 registry.activate 写进 record.broken，预设直接显示「加载失败」。
# 已踩过：第一版就是这么写的，UI 红标「加载失败」，但单测全绿（单测不跑 cordis 求值）。
#
# 随包技能由 preset/index.js 在注册前同步到 $DSH_HOME/jianbao/skills，
# 所以这里指那个路径 —— 与逆向预设用 dshHomePath('redteam/skills') 是同一套做法。
- id: skill-filesystem
  name: '@deepseek-ai/dsh-skill-filesystem'
  config:
    includeDefaultRoots: false
    customSkillDirs:
      - !!js dshHomePath('jianbao/skills')

- id: tool-skill
  name: '@deepseek-ai/dsh-tool-skill'

# ── 联网：查资料、核事实 ──────────────────────────────────────────
- id: tool-web
  name: '@deepseek-ai/dsh-tool-web'
  config:
    fetch: true
    searchTimeoutMs: 60000

# ── 交互 ──────────────────────────────────────────────────────────
- id: tool-ask-user
  name: '@deepseek-ai/dsh-tool-ask-user'

- id: tool-todo
  name: '@deepseek-ai/dsh-tool-todo'
  config:
    allowParallelInProgress: false

- id: present
  name: '@deepseek-ai/dsh-tool-present'

# ── 简报本体：三只工具 + 工作台门控 ───────────────────────────────
#
# **isolate: jianbao 不能省。** 这一行的 apply() 里有 ctx.provide('jianbao', service)
# 发布 Remote 服务，而 cordis 的 provide 会把服务写进 root 的 isolate 表
#   this.ctx.root[symbols.isolate][name] ??= Symbol(name)   （cordis/lib/index.js:805）
# 于是 mountPreset 结束时 leakedServices() 会把它判成「发布到根 realm 的服务」：
#   if (rootIsolate[impl.name] === key) leaked.push(impl.name)
#   if (leaked.length > 0) throw new Error('Preset services require isolate realms: ...')
# —— 整份预设挂不上，UI 只显示四个字「加载失败」。
#
# 加 isolate 之后这一行的服务在自己的 realm 里，不再泄漏到根。
# 下面 compaction 组带 isolate 是同一个道理（它 provides compaction 服务）。
- id: jianbao
  name: '@zws/dsh-jianbao'
  isolate:
    jianbao: true
  config:
    presetId: jianbao

# ── 压缩：长会话不挂这个会在上下文打满后直接失败 ──────────────────
- id: compaction
  name: cordis:group
  group: true
  isolate:
    compaction: true
    toolResultPruner: true
  config:
    - id: compaction-basic
      name: '@deepseek-ai/dsh-compaction-basic'

    - id: command-compact
      name: '@deepseek-ai/dsh-command-compact'

    - id: tool-result-pruner
      name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
      config:
        thresholdChars: 8192
        headChars: 4096
        tailChars: 1024
