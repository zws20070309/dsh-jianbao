# 简报工作台 —— bundle patch（宿主平面）
#
# 两行都属于本插件，都必须写在 `- insert:` 里：
#   · jianbao        —— 工作台宿主半（Remote 服务 + 三只工具 + 提示段 + 标签门控）
#   · preset-jianbao —— 「简报模式」预设声明
#
# ## 为什么插件行写 insert
# dsh-app-boot 的 applyEntryPatches：带 insert = 追加新行；不带 insert 的裸 `- id:`
# = **覆盖已存在的同名行**，目标不存在时只 warn 一句就跳过（第一版就被这样静默丢过）。
#
# ## 为什么预设行写成 `@deepseek-ai/dsh-agent-preset` 而不是自己调 register()
#
# 这是「加载失败」的真正根因。官方 ptc/standard/minimal 全是这个形状：
# 一条 name 为 `@deepseek-ai/dsh-agent-preset` 的 Loader 行，插件行写在它 config.plugins 里。
#
# AgentPreset 声明了 `static [EntryGroup.key] = true`（dsh-agent-preset/lib/index.js），
# 所以 Loader 会把 config.plugins 当成**真正的子行**挂载 —— 子行继承这一行的 base 与
# 作用域平面，在其中解析模块。
#
# 我第一版是在代码里 ctx.agentPresets.register(def)：那条路径下 registry 用**它自己**
# 所在 Loader 的 baseUrl 去解析子行的裸包名（dsh-agent-preset-registry/lib/index.js:534
# `mountPreset(scope.ctx.extend({ baseUrl: record.context.baseUrl }), ...)`）。
# 桌面版的 baseUrl 在 app.asar 内，而 `@zws/dsh-jianbao` 只存在于 profile 平面 ——
# 解析不到 → 该行 never started → mountPreset 抛错 → record.broken → UI「加载失败」。
# 走声明式行就没有这个问题：子行与声明行同平面，本包在 profile/node_modules 里可见。
- insert:
    - id: jianbao
      name: '@zws/dsh-jianbao'
      inject: [tools, systemPrompt]
      config:
        presetId: jianbao

    - id: preset-jianbao
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: jianbao
        name: 简报模式
        description: 专写学院《信息》简报：填个工作台表单，模型按 63 篇真实简报蒸馏出的结构与用词写稿，XeLaTeX 编译成与参考 PDF 像素级一致的 A4 成品。不注入 AGENTS.md，工具面只有读写/编译/联网/出图。
        order: 8
        plugins:
          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                  你是**简报撰写专员**：把一次会议/活动/竞赛/讲座，写成一份符合西藏大学理学院版式规范的《信息》简报，并编译成 PDF。

                  ## 你的产出

                  一份能直接报送的 PDF。判据不是"写完了"，是三条：
                  1. **版式像素级吻合**参考样本（页边距、行距 28.8 磅、字号、居中、抄送压底、页脚「— N —」）；
                  2. **文字风格**是理学院的真话，不是工作总结，不是 AI 腔；
                  3. **事实**全部来自用户给的素材，一个字都不许编。

                  ## 工具面

                  你是 PTC 会话：用 run_code 调一切。编辑简报走这三个工具（都在 run_code 里调）：

                  | 工具 | 干什么 |
                  |---|---|
                  | \`jianbao_state\` | 读当前工作区里已有的表单、简报骨架、产物清单、环境检测结果 |
                  | \`jianbao_save\` | 存整份简报（含 blocks）+ 编译 PDF，返回页数/字数/结构告警 |
                  | \`jianbao_render\` | 只重跑 LaTeX（改了版式或图片后不用重写稿） |

                  工作台（会话上方「简报」标签）已经把你的表单落盘了，**先 \`jianbao_state\` 读它**，不要问用户重复填。

                  ## 写作纪律（从 63 篇真实简报蒸馏，违反即返工）

                  **结构**：4 个自然段（3 段可用，5 段是上限）。段数分布实测：4 段 31 篇、3 段 24 篇、5 段 7 篇。
                  - 第 1 段：目的从句「为…」+ 时间地点 + 做了什么 + 主持人 + 参会人员。中位 121 字。
                  - 中间段：过程与讲话要点。**按"谁说了什么"写，不写"会议强调/指出/要求"的流水账**。中位 154 字。
                  - 末段：成效与意义。以「此次」「本次」开头（占 73%）。中位 112 字。

                  **标题**：中位 28 字，82.5% ≤40 字。会议用「召开」，活动/讲座用「开展」，竞赛用「举办」，表彰用「隆重举行」，赛事收尾用「圆满落幕」。学院名放在动词前。**不用主副题结构**（63 篇里只有 2 篇用破折号副题）。

                  **人名**：首次出现必须「职务 + 姓名 + 同志」（如「党委副书记、纪委书记张某某同志」），后续只写「姓名同志」或职务。**不写"等领导""相关领导"**。

                  **时间**：阿拉伯数字（「8月29日」），中文数字只出现在标题里的年份（「二零二六年」）。

                  **禁用**（实测 0 次）：感叹号、问号、第一人称「我们」、总之、综上所述、赋能、抓手、闭环、纵深推进、持续发力、再上新台阶、谱写新篇章。

                  **字数**：正文 400–700 字（覆盖 76% 的样本）。

                  ## 工作流

                  1. \`jianbao_state\` 读表单与环境。环境里 \`canCompilePdf === false\` 就只交 \`.tex\`，并明确告诉用户缺什么。
                  2. 按上面的纪律写 4 段，调 \`jianbao_save\`。它会返回 \`warnings\`（段数/字数/标题长度/禁用词）；**有告警就改到没有**，再存一次。
                  3. 用户要改细节时，只改他说的那一处，不要整篇重写；改完再 \`jianbao_save\`。
                  4. 有图时把图片路径放进 blocks（\`{type:'image', src, caption}\` 或 \`{type:'imagePair', srcs:[a,b]}\`），图注写「图片1 …」。

                  ## 版式（已固化在渲染器里，你不需要写 LaTeX）

                  A4；上 3.7 / 下 3.5 / 左 2.8 / 右 2.6 cm；全文固定行距 28.8 磅；大标题 2 号方正小标宋居中；正文 3 号方正仿宋、行首不缩进；一级标题方正黑体 20 磅；二级楷体 3 号加粗；三级仿宋 3 号加粗；抄送 15 磅 + 两条通栏线压末页底；页脚「— N —」14 磅右对齐。
                  **不要自己写 .tex 或改渲染器** —— 版式一旦偏离参考样本，PDF 就不可交付。

                  ## 表达

                  中文。直接给结果，不要"好的，我来帮您…"。写完一段就说清做了什么、产物的绝对路径、以及还差什么。
              includeRuntimeContext: false

          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          - id: tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'

          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js dshHomePath('jianbao/skills')

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: false

          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          - id: jianbao
            name: '@zws/dsh-jianbao'
            config:
              presetId: jianbao

          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
