# 简报工作台 —— bundle patch（宿主平面）
#
# 本文件由 node tools/build-patch.mjs 生成，不要手改。
# 改插件行 -> preset/agent.cordis.yml；改提示词 -> preset/prompt.md。
#
# 两条 insert 行：
#   jianbao        工作台宿主半（Remote 服务 + 三只工具 + 提示段 + 标签门控）
#   preset-jianbao 简报模式预设声明
#
# 两条都必须写在 - insert: 里。dsh-app-boot 的 applyEntryPatches 语义：
# 带 insert = 追加新行；不带 insert 的裸 - id: = 覆盖已存在的同名行，
# 目标不存在时只 warn 一句就跳过（第一版就被这样静默丢过）。
#
# 预设为什么写成 @deepseek-ai/dsh-agent-preset 而不是自己调 register()：
# AgentPreset 声明了 static [EntryGroup.key] = true，
# Loader 会把 config.plugins 挂成真正的子行，与声明行同平面解析。
# 而在代码里 ctx.agentPresets.register() 时，registry 用它自己所在 Loader 的
# baseUrl 解析子行裸包名（dsh-agent-preset-registry/lib/index.js:534）；
# 桌面版那个 base 在 app.asar 内，@zws/dsh-jianbao 只在 profile 平面 ——
# 解析不到 -> never started -> mountPreset 抛错 -> broken -> UI 加载失败。
#
# 提示词不能留占位符：补丁里的字符串不会被任何代码展开，
# 占位符会原样进模型提示词。所以这里内联正文。
- insert:
    # 顶层服务行：provide 工作台 Remote 服务 + 常驻提示段。
    #
    # **必须在预设外面。** 预设里 provide 服务是死路：
    #   · 不 isolate → cordis 把服务写进根 isolate 表（cordis:805），
    #     mountPreset 收尾 leakedServices() 命中后抛
    #     「Preset services require isolate realms: jianbao」，整份预设挂不上；
    #   · 加 isolate → 服务隔离进预设子 scope，网关 collectSrcClaims() 遍历的是
    #     网关自己的 ctx.reflect.props + this.ctx.get(serviceKey)，
    #     实测 root.get(jianbao) === false，网关发现不了，
    #     浏览器侧 remote.jianbao 永远「未挂载」。
    #
    # 官方所有 preset 的插件行都只注册工具、不 provide 服务，就是这个原因。
    - id: jianbao
      name: '@zws/dsh-jianbao'
      inject: [tools, systemPrompt]
      config:
        presetId: jianbao
    - id: preset-jianbao
      name: '@deepseek-ai/dsh-agent-preset'
      config:
        id: jianbao
        name: "简报模式"
        description: "专写学院《信息》简报：填个工作台表单，模型按 63 篇真实简报蒸馏出的结构与用词写稿，XeLaTeX 编译成与参考 PDF 像素级一致的 A4 成品。不注入 AGENTS.md，工具面只有读写/编译/联网/出图。"
        order: 8
        plugins:
          # 简报预设（jianbao）—— 由 PTC 派生，只保留写简报需要的工具面。
          #
          # 关键差异（相对官方 ptc）：
          #   1. persona.prefix 载入本目录 prompt.md —— 简报专岗提示词，**不注入 AGENTS.md**
          #      （agent-instructions 行被移除，所以 ~/.dsh/AGENTS.md 不会进来）；
          #   2. skill-filesystem 只扫本包随带技能目录，不扫用户技能根；
          #   3. tool-allow-guard 把工具面收窄到"读/写/编译/搜/图"几类，去掉 mcp/skill/blender/terminal；
          #   4. 挂 dsh-jianbao 的 gate 行：只有本预设的会话才允许注册「简报」工作台入口。
          #
          # 下面 persona.prefix 的占位符由 index.js 在注册前替换成 prompt.md 正文
          # （块标量缩进逐行补齐）。注意注释里不能出现那个占位符字面量 ——
          # indexOf 会命中第一处，替换就落到注释行上，YAML 直接废掉（已踩过）。

          - id: persona
            name: '@deepseek-ai/dsh-persona'
            config:
              prefix: |-
                你是**简报撰写专员**：把一次会议/活动/竞赛/讲座，写成一份符合西藏大学理学院版式规范的《信息》简报，并编译成 PDF。

                ## 你的产出

                一份能直接报送的 PDF。判据不是"写完了"，是三条：
                1. **版式像素级吻合**参考样本（页边距、行距 28.8 磅、字号、居中、抄送压底、页脚「— N —」）；
                2. **文字风格**是理学院的真话，不是工作总结，不是 AI 腔；
                3. **事实**全部来自用户给的素材，一个字都不许编。

                ## 工具面

                你是 PTC 会话：用 run_code 调一切。编辑简报走这三个工具（都在 run_code 里调）：

                | 工具 | 干什么 |
                |---|---|
                | \`jianbao_state\` | 读当前工作区里已有的表单、简报骨架、产物清单、环境检测结果 |
                | \`jianbao_save\` | 存整份简报（含 blocks）+ 编译 PDF，返回页数/字数/结构告警 |
                | \`jianbao_render\` | 只重跑 LaTeX（改了版式或图片后不用重写稿） |

                工作台（会话上方「简报」标签）已经把你的表单落盘了，**先 \`jianbao_state\` 读它**，不要问用户重复填。

                ## 写作纪律（从 63 篇真实简报蒸馏，违反即返工）

                **结构**：4 个自然段（3 段可用，5 段是上限）。段数分布实测：4 段 31 篇、3 段 24 篇、5 段 7 篇。
                - 第 1 段：目的从句「为…」+ 时间地点 + 做了什么 + 主持人 + 参会人员。中位 121 字。
                - 中间段：过程与讲话要点。**按"谁说了什么"写，不写"会议强调/指出/要求"的流水账**。中位 154 字。
                - 末段：成效与意义。以「此次」「本次」开头（占 73%）。中位 112 字。

                **标题**：中位 28 字，82.5% ≤40 字。会议用「召开」，活动/讲座用「开展」，竞赛用「举办」，表彰用「隆重举行」，赛事收尾用「圆满落幕」。学院名放在动词前。**不用主副题结构**（63 篇里只有 2 篇用破折号副题）。

                **人名**：首次出现必须「职务 + 姓名 + 同志」（如「党委副书记、纪委书记张某某同志」），后续只写「姓名同志」或职务。**不写"等领导""相关领导"**。

                **时间**：阿拉伯数字（「8月29日」），中文数字只出现在标题里的年份（「二零二六年」）。

                **禁用**（实测 0 次）：感叹号、问号、第一人称「我们」、总之、综上所述、赋能、抓手、闭环、纵深推进、持续发力、再上新台阶、谱写新篇章。

                **字数**：正文 400–700 字（覆盖 76% 的样本）。

                ## 工作流

                1. \`jianbao_state\` 读表单与环境。环境里 \`canCompilePdf === false\` 就只交 \`.tex\`，并明确告诉用户缺什么。
                2. 按上面的纪律写 4 段，调 \`jianbao_save\`。它会返回 \`warnings\`（段数/字数/标题长度/禁用词）；**有告警就改到没有**，再存一次。
                3. 用户要改细节时，只改他说的那一处，不要整篇重写；改完再 \`jianbao_save\`。
                4. 有图时把图片路径放进 blocks（\`{type:'image', src, caption}\` 或 \`{type:'imagePair', srcs:[a,b]}\`），图注写「图片1 …」。

                ## 版式（已固化在渲染器里，你不需要写 LaTeX）

                A4；上 3.7 / 下 3.5 / 左 2.8 / 右 2.6 cm；全文固定行距 28.8 磅；大标题 2 号方正小标宋居中；正文 3 号方正仿宋、行首不缩进；一级标题方正黑体 20 磅；二级楷体 3 号加粗；三级仿宋 3 号加粗；抄送 15 磅 + 两条通栏线压末页底；页脚「— N —」14 磅右对齐。
                **不要自己写 .tex 或改渲染器** —— 版式一旦偏离参考样本，PDF 就不可交付。

                ## 表达

                中文。直接给结果，不要"好的，我来帮您…"。写完一段就说清做了什么、产物的绝对路径、以及还差什么。
              includeRuntimeContext: false

          - id: time-context
            name: '@deepseek-ai/dsh-time-context'

          # ── shell：写稿要跑 xelatex，两个平台都留 ──────────────────────────
          - id: tool-bash
            name: '@deepseek-ai/dsh-tool-bash'
            disabled: !!js process.platform === 'win32'

          - id: tool-pwsh
            name: '@deepseek-ai/dsh-tool-pwsh'
            disabled: !!js process.platform !== 'win32'

          # ── filesystem ────────────────────────────────────────────────────
          - id: tool-fs
            name: '@deepseek-ai/dsh-tool-fs'

          - id: tool-fs-search
            name: '@deepseek-ai/dsh-tool-fs-search'
            config:
              sampleOverCapGlobResults: false

          # ── PTC 运行时（按可用性条件挂载）────────────────────────────────
          #
          # **这一行曾经让整份预设 broken，必须保住一个事实：**
          # registry 解析预设里的**裸包名**时，用的是它自己所在 Loader 的 base
          # （桌面版 = asar 内的 dsh 安装平面），不是 profile 平面。
          #   · @deepseek-ai/dsh-tool-executor-ptc 只随桌面版 asar 发行，npm 安装里没有；
          #   · @zws/dsh-jianbao（下面简报本体那行）只存在于 profile。
          # 两者从「另一个平面」都解析不到，而**任何一行失败都会让整份预设作废**。
          #
          # 所以包里写的是包名，由 preset/index.js 的 resolveRowNames() 在交给 registry 前
          # 把每一行的 name 重新解析成**绝对 file:// URL**；解析不到的整行丢弃（而不是留着炸）。
          - id: tool-executor-ptc
            name: '@deepseek-ai/dsh-tool-executor-ptc'

          # ── skills：只扫本包随带的技能目录 ────────────────────────────────
          #
          # 目录用 JS 表达式 + dshHomePath 给：**不能写 import.meta** —— cordis 求值那个标签时用的是
          #   new Function('ctx', 'expr', 'with (ctx) { return eval(expr) }')
          # 在 new Function 里 import.meta 是**语法错误**（Cannot use 'import.meta' outside a module），
          # 抛出的 SyntaxError 会被 registry.activate 写进 record.broken，预设直接显示「加载失败」。
          # 已踩过：第一版就是这么写的，UI 红标「加载失败」，但单测全绿（单测不跑 cordis 求值）。
          #
          # 随包技能由 preset/index.js 在注册前同步到 $DSH_HOME/jianbao/skills，
          # 所以这里指那个路径 —— 与逆向预设用 dshHomePath('redteam/skills') 是同一套做法。
          - id: skill-filesystem
            name: '@deepseek-ai/dsh-skill-filesystem'
            config:
              includeDefaultRoots: false
              customSkillDirs:
                - !!js dshHomePath('jianbao/skills')

          - id: tool-skill
            name: '@deepseek-ai/dsh-tool-skill'

          # ── 联网：查资料、核事实 ──────────────────────────────────────────
          - id: tool-web
            name: '@deepseek-ai/dsh-tool-web'
            config:
              fetch: true
              searchTimeoutMs: 60000

          # ── 交互 ──────────────────────────────────────────────────────────
          - id: tool-ask-user
            name: '@deepseek-ai/dsh-tool-ask-user'

          - id: tool-todo
            name: '@deepseek-ai/dsh-tool-todo'
            config:
              allowParallelInProgress: false

          - id: present
            name: '@deepseek-ai/dsh-tool-present'

          # ── 压缩：长会话不挂这个会在上下文打满后直接失败 ──────────────────
          #
          # 注意：**本预设里不再出现任何 @zws/* 行。**
          #
          # 三只简报工具由顶层 jianbao 行（不在预设里）的 apply() 一起注册，全局可见。
          # 原因是预设子行的模块名解析不可靠：
          #   cordis-plugin-loader/lib/index.js:214-227
          #     裸包名 → ctx.loader.internal.import(name, ctx.baseUrl)   // Node 内部 ESM 加载器
          #     相对名 → new URL(name, ctx.baseUrl)
          #   而 registry 的 baseUrl 在桌面版指向 asar 内 —— 实测那一片解析不到 @zws/*；
          #   指向 profile 时又解析不到 @deepseek-ai/*。两个平面都不可靠。
          #
          # 让 @zws 彻底离开 config.plugins，这个变量就不存在了。
          # 副作用：工具在别的预设会话里也可见 —— 可接受：没有 .jianbao/ 工程时工具会
          # 明确回「还没有简报数据」；工作台入口仍由 gate 按 preset 控制，别的会话看不到标签。
          - id: compaction
            name: cordis:group
            group: true
            isolate:
              compaction: true
              toolResultPruner: true
            config:
              - id: compaction-basic
                name: '@deepseek-ai/dsh-compaction-basic'

              - id: command-compact
                name: '@deepseek-ai/dsh-command-compact'

              - id: tool-result-pruner
                name: '@deepseek-ai/dsh-compaction-tool-result-pruner'
                config:
                  thresholdChars: 8192
                  headChars: 4096
                  tailChars: 1024
